    // ============================================================
    // SNIPPET ENGINE
    // ============================================================
    function insertSnippetTemplate(cm, template, from, to) {
        var insertText = '';
        var placeholders = [];
        var regex = /\$\{(\d+)(?::([^}]*))?\}/g;
        var lastIndex = 0;
        var m;
        while ((m = regex.exec(template)) !== null) {
            insertText += template.slice(lastIndex, m.index);
            placeholders.push({ num: parseInt(m[1], 10), text: m[2] || '', offset: insertText.length, length: (m[2] || '').length });
            insertText += m[2] || '';
            lastIndex = regex.lastIndex;
        }
        insertText += template.slice(lastIndex);

        clearSnippetMarks();
        snippetSession = null;
        cm.replaceRange(insertText, from, to);

        function advance(pos, text) {
            var parts = text.split('\n');
            if (parts.length === 1) return { line: pos.line, ch: pos.ch + parts[0].length };
            return { line: pos.line + parts.length - 1, ch: parts[parts.length - 1].length };
        }
        placeholders.forEach(function (ph) {
            var before = insertText.slice(0, ph.offset);
            ph.start = advance({ line: from.line, ch: from.ch }, before);
            ph.end = advance(ph.start, ph.text);
        });
        placeholders.sort(function (a, b) { return a.num - b.num; });
        if (placeholders.length === 0) {
            cm.setCursor(advance({ line: from.line, ch: from.ch }, insertText));
            return;
        }
        snippetSession = { cm: cm, placeholders: placeholders, current: 0, doc: cm.getDoc() };
        var first = placeholders[0];
        cm.setSelection(first.start, first.end);
        markPlaceholder(first);
    }
    function markPlaceholder(ph) {
        if (!ph || !snippetSession) return;
        try {
            ph._mark = snippetSession.doc.markText(ph.start, ph.end, { className: 'cm-snippet-placeholder', inclusiveLeft: false, inclusiveRight: false });
        } catch (e) {}
    }
    function clearSnippetMarks() {
        if (snippetSession) {
            snippetSession.placeholders.forEach(function (ph) {
                if (ph._mark) { try { ph._mark.clear(); } catch (e) {} ph._mark = null; }
            });
        }
    }
    function endSnippetSession() {
        if (!snippetSession) return;
        clearSnippetMarks();
        snippetSession = null;
    }
    function gotoNextPlaceholder(cm) {
        if (!snippetSession || snippetSession.cm !== cm) return false;
        var next = snippetSession.current + 1;
        if (next >= snippetSession.placeholders.length) { endSnippetSession(); return false; }
        snippetSession.current = next;
        var ph = snippetSession.placeholders[next];
        cm.setSelection(ph.start, ph.end);
        markPlaceholder(ph);
        return true;
    }
    function gotoPrevPlaceholder(cm) {
        if (!snippetSession || snippetSession.cm !== cm) return false;
        var prev = snippetSession.current - 1;
        if (prev < 0) return false;
        snippetSession.current = prev;
        var ph = snippetSession.placeholders[prev];
        cm.setSelection(ph.start, ph.end);
        markPlaceholder(ph);
        return true;
    }

    // ============================================================
    // FUZZY SCORING
    // ============================================================
    function fuzzyScore(query, target) {
        if (!query) return { score: 0, matches: [] };
        if (!target) return null;
        var q = query.toLowerCase(), t = target.toLowerCase();
        var qLen = q.length, tLen = t.length;

        if (q === t) {
            var em = [];
            for (var i = 0; i < qLen; i++) em.push(i);
            return { score: 10000, matches: em };
        }
        if (t.indexOf(q) === 0) {
            var pm = [];
            for (var j = 0; j < qLen; j++) pm.push(j);
            return { score: 5000 + (qLen / tLen) * 500 - tLen, matches: pm };
        }
        var subIdx = t.indexOf(q);
        if (subIdx > 0) {
            var prevChar = t.charAt(subIdx - 1);
            var isBoundary = /[.\-_\/\s]/.test(prevChar);
            var sm = [];
            for (var k = 0; k < qLen; k++) sm.push(subIdx + k);
            return { score: (isBoundary ? 2000 : 1000) - subIdx * 5, matches: sm };
        }

        var score = 0, matches = [], lastMatch = -1, ti = 0;
        for (var qi = 0; qi < qLen; qi++) {
            var qch = q.charAt(qi);
            var found = -1;
            for (var t2 = ti; t2 < tLen; t2++) {
                if (t.charAt(t2) === qch) { found = t2; break; }
            }
            if (found === -1) return null;
            if (lastMatch >= 0 && found === lastMatch + 1) score += 60;
            if (found === 0 || /[.\-_\/\s]/.test(t.charAt(found - 1))) score += 40;
            else if (found > 0 && target.charAt(found) !== t.charAt(found) && /[a-z]/.test(target.charAt(found - 1))) score += 30;
            if (qi === 0 && found === 0) score += 50;
            if (lastMatch >= 0 && found > lastMatch + 1) score -= (found - lastMatch - 1) * 4;
            matches.push(found);
            lastMatch = found;
            ti = found + 1;
        }
        score -= (tLen - qLen) * 2;
        if (score <= 0) return null;
        return { score: score, matches: matches };
    }

    function renderMatchHighlight(label, matches) {
        if (!matches || matches.length === 0) return escapeHtml(label);
        var result = '', matchSet = {};
        matches.forEach(function (i) { matchSet[i] = true; });
        for (var i = 0; i < label.length; i++) {
            var ch = escapeHtml(label.charAt(i));
            result += matchSet[i] ? '<span class="hint-match">' + ch + '</span>' : ch;
        }
        return result;
    }

    // ============================================================
    // HINT ENGINE
    // ============================================================
    function getCurrentWord(cm) {
        var cur = cm.getCursor();
        var line = cm.getLine(cur.line);
        var end = cur.ch, start = end;
        while (start > 0 && /[\w\.\-$]/.test(line.charAt(start - 1))) start--;
        return { word: line.slice(start, end), start: start, end: end };
    }
    function getActiveLang(cm) {
        var mode = cm.getOption('mode') || 'javascript';
        if (mode === 'htmlmixed') return 'htmlmixed';
        if (mode === 'css') return 'css';
        return 'javascript';
    }
    function computeHints(cm) {
        var cur = cm.getCursor();
        var line = cm.getLine(cur.line);
        var before = line.slice(0, cur.ch);
        if (/^\s*(\/\/|\*|\/\*)/.test(before)) return null;
        var wordInfo = getCurrentWord(cm);
        var query = wordInfo.word;
        if (query.length < 1) return null;
        var lastCh = query.charAt(query.length - 1);
        if (!/[\w\.\-$]/.test(lastCh)) return null;
        var lang = getActiveLang(cm);
        var snippets = SNIPPETS[lang] || [];
        var apis = LANGUAGE_APIS[lang] || [];
        var seen = {}, candidates = [];
        function addC(item) { if (seen[item.label]) return; seen[item.label] = true; candidates.push(item); }
        snippets.forEach(addC);
        apis.forEach(addC);
        var docText = cm.getValue();
        var wordRegex = /\b[a-zA-Z_$][a-zA-Z0-9_$]{2,}\b/g;
        var mm;
        while ((mm = wordRegex.exec(docText)) !== null) {
            var w = mm[0];
            if (!seen[w] && w !== query) { seen[w] = true; candidates.push({ label: w, detail: 'from document', type: 'variable' }); }
        }
        var scored = [];
        for (var i = 0; i < candidates.length; i++) {
            var c = candidates[i];
            var result = fuzzyScore(query, c.label);
            if (result !== null) {
                var bonus = c.type === 'snippet' ? 150 : 0;
                scored.push({ candidate: c, score: result.score + bonus, matches: result.matches });
            }
        }
        if (scored.length === 0) return null;
        scored.sort(function (a, b) { return b.score - a.score; });
        scored = scored.slice(0, 60);
        var list = scored.map(function (s) {
            var c = s.candidate;
            var item = { text: c.label, displayText: c.label, detail: c.detail, type: c.type, _matches: s.matches, _snippet: c.insert };
            if (c.insert) {
                item.hint = function (cm2, data, completion) {
                    insertSnippetTemplate(cm2, c.insert, completion.from, completion.to);
                };
            }
            return item;
        });
        currentHintQuery = query;
        return { list: list, from: CodeMirror.Pos(cur.line, wordInfo.start), to: cur };
    }
    function renderHintItem(el, data) {
        var type = data.type || 'variable';
        var prefixMap = { snippet: 'S', keyword: 'K', function: 'ƒ', method: 'ƒ', property: 'P', class: 'C', variable: 'V', tag: 'T', attribute: 'A', 'css-prop': '{}' };
        var prefix = prefixMap[type] || '·';
        var label = data.displayText || data.text;
        var matches = data._matches || [];
        var highlighted = renderMatchHighlight(label, matches);
        var detailHtml = data.detail ? '<span class="hint-detail">' + escapeHtml(data.detail) + '</span>' : '';
        el.innerHTML = '<span class="hint-prefix ' + type + '">' + prefix + '</span>' +
                       '<span class="hint-label">' + highlighted + '</span>' + detailHtml;
    }

    // ============================================================
    // TAB / ENTER
    // ============================================================
    function handleTab(cm) {
        if (cm.state.completionActive) { cm.state.completionActive.pick(); return; }
        if (snippetSession && snippetSession.cm === cm) { if (gotoNextPlaceholder(cm)) return; }
        var wordInfo = getCurrentWord(cm);
        var word = wordInfo.word;
        if (word) {
            var lang = getActiveLang(cm);
            var snips = SNIPPETS[lang] || [];
            var exact = null;
            for (var i = 0; i < snips.length; i++) if (snips[i].label === word) { exact = snips[i]; break; }
            if (exact && exact.insert) {
                insertSnippetTemplate(cm, exact.insert, CodeMirror.Pos(cm.getCursor().line, wordInfo.start), cm.getCursor());
                return;
            }
        }
        if (cm.somethingSelected()) cm.indentSelection('add');
        else cm.replaceSelection('    ', 'end');
    }
    function handleShiftTab(cm) {
        if (snippetSession && snippetSession.cm === cm) gotoPrevPlaceholder(cm);
        else cm.indentSelection('subtract');
    }
    function handleEnter(cm) {
        if (cm.state.completionActive) { cm.state.completionActive.pick(); return; }
        return CodeMirror.Pass;
    }
    function triggerHintOnInput(cm, change) {
        if (change.origin !== '+input' && change.origin !== 'paste') return;
        var typed = change.text[0];
        if (!typed) return;
        if (!/[a-zA-Z_$\.]/.test(typed)) return;
        clearTimeout(cm._hintTimer);
        cm._hintTimer = setTimeout(function () {
            if (cm.state.completionActive) return;
            if (computeHints(cm)) {
                cm.showHint({ hint: computeHints, completeSingle: false, alignWithWord: true, closeOnUnfocus: true });
            }
        }, 120);
    }

    // ============================================================
    // EDITOR
    // ============================================================
    function initEditor() {
        editor = CodeMirror(editorContainer, {
            value: '', mode: 'javascript', theme: 'dracula',
            lineNumbers: true, indentUnit: 4, tabSize: 4, indentWithTabs: false,
            smartIndent: true, matchBrackets: true, autoCloseBrackets: true, foldGutter: true,
            gutters: ['CodeMirror-linenumbers', 'CodeMirror-foldgutter'],
            lineWrapping: true,
            extraKeys: {
                'Ctrl-S': function () { forceSave(); },
                'Cmd-S': function () { forceSave(); },
                'Ctrl-Shift-S': function () { openSaveMenu(); },
                'Cmd-Shift-S': function () { openSaveMenu(); },
                'Ctrl-B': function () { toggleSidebar(); },
                'Cmd-B': function () { toggleSidebar(); },
                'F5': function () { togglePreview(); },
                'Ctrl-Space': function (cm) { cm.showHint({ hint: computeHints, completeSingle: false, alignWithWord: true }); },
                'Cmd-Space': function (cm) { cm.showHint({ hint: computeHints, completeSingle: false, alignWithWord: true }); },
                'Tab': handleTab,
                'Shift-Tab': handleShiftTab,
                'Enter': handleEnter,
                'Esc': function (cm) {
                    if (snippetSession) { endSnippetSession(); return; }
                    if (cm.state.completionActive) cm.state.completionActive.close();
                }
            }
        });
        editor.setOption('hintOptions', {
            hint: computeHints, completeSingle: false, alignWithWord: true,
            closeOnUnfocus: true, render: renderHintItem
        });
        editor.on('inputRead', triggerHintOnInput);
        editor.on('change', function (cm, change) {
            if (change.origin === '+input' && (change.text[0] === '.' || change.text[0] === '>')) {
                setTimeout(function () {
                    if (cm.state.completionActive) return;
                    if (computeHints(cm)) {
                        cm.showHint({ hint: computeHints, completeSingle: false, alignWithWord: true });
                    }
                }, 80);
            }
        });
        editor.on('cursorActivity', function () {
            var pos = editor.getCursor();
            cursorPositionEl.textContent = 'Ln ' + (pos.line + 1) + ', Col ' + (pos.ch + 1);
            if (snippetSession && snippetSession.cm === editor) {
                var cur = editor.getCursor();
                var inRange = snippetSession.placeholders.some(function (ph) {
                    return (cur.line === ph.start.line && cur.ch >= ph.start.ch && cur.ch <= ph.end.ch) ||
                           (cur.line > ph.start.line && cur.line < ph.end.line);
                });
                if (!inRange && !editor.somethingSelected()) endSnippetSession();
            }
        });
        editor.on('change', function () {
            if (!activeFilePath) return;
            var file = findOpenFile(activeFilePath);
            if (!file || file.type === 'image') return;
            file.content = editor.getValue();
            file.modified = true;
            renderTabs();
            updateDirtyCount();
            clearTimeout(autoSaveTimer);
            autoSaveTimer = setTimeout(function () { autoSave(activeFilePath); }, 800);
            // Schedule browser persistence
            schedulePersist();
        });
    }

    function updateDirtyCount() {
        var n = 0;
        for (var i = 0; i < openFiles.length; i++) if (openFiles[i].modified) n++;
        dirtyCountEl.textContent = n;
    }

    // ============================================================
    // AUTO SAVE
    // ============================================================
    function autoSave(path) {
        var file = findOpenFile(path);
        if (!file) return;
        var fsFile = getFileByPath(path);
        if (fsFile) fsFile.content = file.content;
        file.modified = false;
        renderTabs();
        updateDirtyCount();
        if (previewVisible) {
            clearTimeout(autoPreviewTimer);
            autoPreviewTimer = setTimeout(refreshPreview, 300);
        }
    }
    function forceSave() {
        if (!activeFilePath) { showToast('No file to save', 'info'); return; }
        var file = findOpenFile(activeFilePath);
        if (!file) return;
        var fsFile = getFileByPath(activeFilePath);
        if (fsFile) fsFile.content = file.content;
        file.modified = false;
        renderTabs();
        updateDirtyCount();
        var ok = saveToBrowser(true);
        if (ok) showToast('Saved ' + file.name + ' + workspace', 'success');
        else showToast('Saved ' + file.name + ' (browser save failed)', 'info');
    }

    // ============================================================
    // HELPERS
    // ============================================================
    function findOpenFile(path) {
        for (var i = 0; i < openFiles.length; i++) if (openFiles[i].path === path) return openFiles[i];
        return null;
    }
    function getFileByPath(path) {
        if (!path) return null;
        var parts = path.split('/');
        var current = fileSystem;
        for (var i = 0; i < parts.length - 1; i++) {
            if (!current[parts[i]] || current[parts[i]].type !== 'folder') return null;
            current = current[parts[i]].children;
        }
        return current[parts[parts.length - 1]];
    }
    function getParentFolder(path) {
        var parts = path.split('/');
        parts.pop();
        if (parts.length === 0) return { folder: fileSystem, path: '' };
        var current = fileSystem;
        for (var i = 0; i < parts.length; i++) {
            if (!current[parts[i]] || current[parts[i]].type !== 'folder') return null;
            current = current[parts[i]].children;
        }
        return { folder: current, path: parts.join('/') };
    }
    function escapeHtml(str) {
        var div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    // ============================================================
    // FILE EXPLORER
    // ============================================================
    function renderFileExplorer() {
        fileExplorer.innerHTML = '<div class="drop-hint"><i class="fas fa-cloud-upload-alt" style="font-size:32px;display:block;margin-bottom:8px;"></i>Drop files here to import</div>';
        var entries = [];
        for (var k in fileSystem) if (fileSystem.hasOwnProperty(k)) entries.push([k, fileSystem[k]]);
        if (entries.length === 0) {
            var empty = document.createElement('div');
            empty.className = 'empty-state';
            empty.innerHTML = '<i class="fas fa-folder-open"></i><p>No files yet</p><button onclick="createNewFile()">Create a file</button>';
            fileExplorer.appendChild(empty);
            return;
        }
        entries.sort(function (a, b) {
            if (a[1].type === 'folder' && b[1].type !== 'folder') return -1;
            if (a[1].type !== 'folder' && b[1].type === 'folder') return 1;
            return a[0].localeCompare(b[0]);
        });
        for (var i = 0; i < entries.length; i++) renderItem(entries[i][0], entries[i][1], '', fileExplorer);
    }
    function getFileIcon(name, item) {
        if (item.type === 'image') return { class: 'fa-file-image image-icon', color: '#a074c4' };
        if (name.endsWith('.js')) return { class: 'fa-file-code js-icon', color: '#f1e05a' };
        if (name.endsWith('.html')) return { class: 'fa-file-code html-icon', color: '#e34c26' };
        if (name.endsWith('.css')) return { class: 'fa-file-code css-icon', color: '#563d7c' };
        if (name.endsWith('.json')) return { class: 'fa-file-code json-icon', color: '#cbcb41' };
        if (/\.(png|jpg|jpeg|gif|svg|webp|bmp|ico)$/i.test(name)) return { class: 'fa-file-image image-icon', color: '#a074c4' };
        return { class: 'fa-file', color: '#519aba' };
    }
    function renderItem(name, item, path, container) {
        var fullPath = path ? (path + '/' + name) : name;
        var isSelected = selectedExplorerItem && selectedExplorerItem.path === fullPath;

        if (item.type === 'folder') {
            var isCollapsed = !!collapsedFolders[fullPath];
            var folderEl = document.createElement('div');
            folderEl.className = 'file-item folder' + (isSelected ? ' selected' : '');
            folderEl.innerHTML =
                '<i class="fas fa-chevron-down folder-toggle' + (isCollapsed ? ' collapsed' : '') + '"></i>' +
                '<i class="fas fa-folder' + (isCollapsed ? '' : '-open') + ' folder-icon"></i>' +
                '<span class="item-name">' + escapeHtml(name) + '</span>' +
                '<span class="item-actions">' +
                    '<i class="fas fa-file" title="New File" data-action="new-file"></i>' +
                    '<i class="fas fa-folder-plus" title="New Folder" data-action="new-folder"></i>' +
                    '<i class="fas fa-download" title="Download ZIP" data-action="download"></i>' +
                    '<i class="fas fa-trash" title="Delete folder (Del)" data-action="delete"></i>' +
                '</span>';
            folderEl.addEventListener('click', function (e) {
                if (e.target.closest('.item-actions')) return;
                selectedExplorerItem = { path: fullPath, name: name, isFolder: true };
                if (collapsedFolders[fullPath]) delete collapsedFolders[fullPath];
                else collapsedFolders[fullPath] = true;
                renderFileExplorer();
            });
            folderEl.querySelectorAll('.item-actions i').forEach(function (btn) {
                btn.addEventListener('click', function (e) {
                    e.stopPropagation();
                    var action = btn.getAttribute('data-action');
                    if (action === 'new-file') createNewFile(fullPath);
                    else if (action === 'new-folder') createNewFolder(fullPath);
                    else if (action === 'delete') deleteItem(fullPath, name, true);
                    else if (action === 'download') downloadSingleFolderZip(fullPath, name);
                });
            });
            folderEl.addEventListener('contextmenu', function (e) {
                e.preventDefault();
                selectedExplorerItem = { path: fullPath, name: name, isFolder: true };
                renderFileExplorer();
                showContextMenu(e.clientX, e.clientY, [
                    { icon: 'fa-file', label: 'New File', action: function () { createNewFile(fullPath); } },
                    { icon: 'fa-folder-plus', label: 'New Folder', action: function () { createNewFolder(fullPath); } },
                    { divider: true },
                    { icon: 'fa-i-cursor', label: 'Rename', action: function () { renameItem(fullPath, name); } },
                    { icon: 'fa-file-archive', label: 'Download as ZIP', action: function () { downloadSingleFolderZip(fullPath, name); } },
                    { divider: true },
                    { icon: 'fa-trash', label: 'Delete', danger: true, action: function () { deleteItem(fullPath, name, true); } }
                ]);
            });
            container.appendChild(folderEl);
            if (!isCollapsed) {
                var childrenContainer = document.createElement('div');
                childrenContainer.className = 'file-children';
                container.appendChild(childrenContainer);
                var children = [];
                var childrenObj = item.children || {};
                for (var ck in childrenObj) if (childrenObj.hasOwnProperty(ck)) children.push([ck, childrenObj[ck]]);
                children.sort(function (a, b) {
                    if (a[1].type === 'folder' && b[1].type !== 'folder') return -1;
                    if (a[1].type !== 'folder' && b[1].type === 'folder') return 1;
                    return a[0].localeCompare(b[0]);
                });
                for (var i = 0; i < children.length; i++) renderItem(children[i][0], children[i][1], fullPath, childrenContainer);
            }
        } else {
            var fileEl = document.createElement('div');
            fileEl.className = 'file-item' + (activeFilePath === fullPath ? ' active' : '') + (isSelected ? ' selected' : '');
            var iconInfo = getFileIcon(name, item);
            var openFile = findOpenFile(fullPath);
            var isModified = openFile && openFile.modified;
            fileEl.innerHTML =
                '<i class="fas ' + iconInfo.class + '" style="color:' + iconInfo.color + ';"></i>' +
                '<span class="item-name">' + escapeHtml(name) + (isModified ? ' ●' : '') + '</span>' +
                '<span class="item-actions">' +
                    '<i class="fas fa-download" title="Download" data-action="download"></i>' +
                    '<i class="fas fa-trash" title="Delete (Del)" data-action="delete"></i>' +
                '</span>';
            fileEl.addEventListener('click', function (e) {
                if (e.target.closest('.item-actions')) return;
                selectedExplorerItem = { path: fullPath, name: name, isFolder: false };
                openFileInEditor(fullPath, name, item);
            });
            fileEl.querySelectorAll('.item-actions i').forEach(function (btn) {
                btn.addEventListener('click', function (e) {
                    e.stopPropagation();
                    var action = btn.getAttribute('data-action');
                    if (action === 'delete') deleteItem(fullPath, name, false);
                    else if (action === 'download') downloadSingleFile(fullPath, name, item);
                });
            });
            fileEl.addEventListener('contextmenu', function (e) {
                e.preventDefault();
                selectedExplorerItem = { path: fullPath, name: name, isFolder: false };
                renderFileExplorer();
                showContextMenu(e.clientX, e.clientY, [
                    { icon: 'fa-edit', label: 'Open', action: function () { openFileInEditor(fullPath, name, item); } },
                    { icon: 'fa-i-cursor', label: 'Rename', action: function () { renameItem(fullPath, name); } },
                    { icon: 'fa-download', label: 'Download', action: function () { downloadSingleFile(fullPath, name, item); } },
                    { divider: true },
                    { icon: 'fa-trash', label: 'Delete', danger: true, action: function () { deleteItem(fullPath, name, false); } }
                ]);
            });
            container.appendChild(fileEl);
        }
    }

    function downloadSingleFolderZip(folderPath, folderName) {
        if (typeof JSZip === 'undefined') { showToast('JSZip not loaded', 'error'); return; }
        var folder = getFileByPath(folderPath);
        if (!folder) return;
        var zip = new JSZip();
        function add(folder2, zipFolder) {
            for (var name in folder2) {
                if (!folder2.hasOwnProperty(name)) continue;
                var item = folder2[name];
                if (item.type === 'folder') { var sub = zipFolder.folder(name); if (sub) add(item.children || {}, sub); }
                else if (item.type === 'image') {
                    var parts = item.content.split(',');
                    if (parts.length === 2) zipFolder.file(name, parts[1], { base64: parts[0].indexOf('base64') !== -1 });
                } else zipFolder.file(name, item.content || '');
            }
        }
        add(folder.children || {}, zip);
        zip.generateAsync({ type: 'blob' }).then(function (blob) {
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url;
            a.download = folderName + '-' + timestamp() + '.zip';
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
            setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
            showToast('Downloaded ' + folderName + '.zip', 'success');
        });
    }

    // ============================================================
    // FILE OPS
    // ============================================================
    function openFileInEditor(path, name, fileData) {
        var existing = findOpenFile(path);
        if (existing) { switchToFile(path); return; }
        if (fileData.type === 'image') {
            openFiles.push({ path: path, name: name, language: 'image', content: fileData.content, modified: false, type: 'image' });
            switchToFile(path);
            return;
        }
        var language = 'javascript';
        if (name.endsWith('.html')) language = 'htmlmixed';
        else if (name.endsWith('.css')) language = 'css';
        else if (name.endsWith('.md')) language = 'markdown';
        openFiles.push({ path: path, name: name, language: language, content: fileData.content, modified: false, type: 'text' });
        switchToFile(path);
    }
    function switchToFile(path) {
        var file = findOpenFile(path);
        if (!file) return;
        activeFilePath = path;
        endSnippetSession();
        if (file.type === 'image') {
            editorContainer.innerHTML = '<div class="image-viewer"><img src="' + file.content + '" alt="' + escapeHtml(file.name) + '"></div>';
            fileLanguageEl.textContent = 'Image';
            cursorPositionEl.textContent = '—';
        } else {
            if (!editorContainer.querySelector('.CodeMirror')) {
                editorContainer.innerHTML = '';
                editor = null;
                initEditor();
            }
            editor.setValue(file.content);
            editor.setOption('mode', file.language);
            file.modified = false;
            editor.setCursor(0, 0);
            editor.focus();
            var langNames = { 'javascript': 'JavaScript', 'htmlmixed': 'HTML', 'css': 'CSS', 'markdown': 'Markdown' };
            fileLanguageEl.textContent = langNames[file.language] || 'Plain Text';
        }
        renderTabs();
        renderFileExplorer();
        updateTitleBar();
        updateDirtyCount();
    }
    function closeFile(path, event) {
        if (event) event.stopPropagation();
        var index = -1;
        for (var i = 0; i < openFiles.length; i++) if (openFiles[i].path === path) { index = i; break; }
        if (index === -1) return;
        openFiles.splice(index, 1);
        if (activeFilePath === path) {
            if (openFiles.length > 0) switchToFile(openFiles[openFiles.length - 1].path);
            else {
                activeFilePath = null;
                if (editor) { editor.setValue(''); editor.setOption('mode', 'javascript'); }
                fileLanguageEl.textContent = 'JavaScript';
                cursorPositionEl.textContent = 'Ln 1, Col 1';
                renderTabs();
                updateTitleBar();
            }
        } else renderTabs();
        renderFileExplorer();
    }
    function updateTitleBar() {
        var titleEl = document.querySelector('.title-bar .title');
        if (activeFilePath) {
            var file = findOpenFile(activeFilePath);
            titleEl.textContent = 'Lightweight VS Code - ' + (file ? file.name : 'Untitled');
        } else titleEl.textContent = 'Lightweight VS Code - Welcome';
    }
    function createNewFile(parentPath) {
        parentPath = parentPath || '';
        showInputModal('New File', 'Enter file name (e.g., index.html):', '', function (name) {
            if (!name) return;
            var targetFolder = parentPath ? getFileByPath(parentPath) : null;
            var container = parentPath ? (targetFolder && targetFolder.children) : fileSystem;
            if (!container) { showToast('Invalid location', 'error'); return; }
            if (container[name]) { showToast('File already exists', 'error'); return; }
            var language = 'javascript';
            if (name.endsWith('.html')) language = 'htmlmixed';
            else if (name.endsWith('.css')) language = 'css';
            else if (name.endsWith('.md')) language = 'markdown';
            container[name] = { type: 'file', language: language, content: '' };
            if (parentPath) delete collapsedFolders[parentPath];
            renderFileExplorer();
            openFileInEditor(parentPath ? (parentPath + '/' + name) : name, name, container[name]);
            showToast('Created ' + name, 'success');
            schedulePersist();
        });
    }
    function createNewFolder(parentPath) {
        parentPath = parentPath || '';
        showInputModal('New Folder', 'Enter folder name:', '', function (name) {
            if (!name) return;
            var targetFolder = parentPath ? getFileByPath(parentPath) : null;
            var container = parentPath ? (targetFolder && targetFolder.children) : fileSystem;
            if (!container) { showToast('Invalid location', 'error'); return; }
            if (container[name]) { showToast('Folder already exists', 'error'); return; }
            container[name] = { type: 'folder', children: {} };
            if (parentPath) delete collapsedFolders[parentPath];
            renderFileExplorer();
            showToast('Created folder ' + name, 'success');
            schedulePersist();
        });
    }
    function renameItem(path, currentName) {
        showInputModal('Rename', 'Enter new name:', currentName, function (newName) {
            if (!newName || newName === currentName) return;
            var parent = getParentFolder(path);
            if (!parent) return;
            if (parent.folder[newName]) { showToast('Name already exists', 'error'); return; }
            var item = parent.folder[currentName];
            if (!item) return;
            delete parent.folder[currentName];
            parent.folder[newName] = item;
            var newPath = parent.path ? (parent.path + '/' + newName) : newName;
            var openFile = findOpenFile(path);
            if (openFile) {
                openFile.path = newPath;
                openFile.name = newName;
                if (activeFilePath === path) activeFilePath = newPath;
            }
            renderFileExplorer(); renderTabs(); updateTitleBar();
            showToast('Renamed to ' + newName, 'success');
            schedulePersist();
        });
    }
    function deleteItem(path, name, isFolder) {
        var item = getFileByPath(path);
        if (!item) return;
        var itemCount = 0;
        if (isFolder) {
            (function count(folder) {
                for (var k in folder) {
                    if (!folder.hasOwnProperty(k)) continue;
                    itemCount++;
                    if (folder[k].type === 'folder') count(folder[k].children || {});
                }
            })(item.children || {});
        }
        var message = isFolder
            ? 'Delete folder "' + name + '" and its ' + itemCount + ' item(s)?'
            : 'Delete "' + name + '"?';
        showConfirmModal(isFolder ? 'Delete Folder' : 'Delete File', message, 'Delete',
            function () { performDelete(path, name, isFolder, item); });
    }
    function performDelete(path, name, isFolder, item) {
        var parent = getParentFolder(path);
        if (!parent) return;
        lastDeletedItem = { parent: parent, path: path, name: name, item: JSON.parse(JSON.stringify(item)), isFolder: isFolder };
        delete parent.folder[name];
        openFiles = openFiles.filter(function (f) { return f.path !== path && f.path.indexOf(path + '/') !== 0; });
        if (activeFilePath === path || (activeFilePath && activeFilePath.indexOf(path + '/') === 0)) {
            if (openFiles.length > 0) switchToFile(openFiles[openFiles.length - 1].path);
            else {
                activeFilePath = null;
                if (editor) { editor.setValue(''); editor.setOption('mode', 'javascript'); }
                renderTabs(); updateTitleBar();
            }
        }
        if (selectedExplorerItem && selectedExplorerItem.path === path) selectedExplorerItem = null;
        renderFileExplorer();
        updateDirtyCount();
        schedulePersist();
        showToastWithUndo('Deleted ' + name, function () {
            if (!lastDeletedItem) return;
            lastDeletedItem.parent.folder[lastDeletedItem.name] = lastDeletedItem.item;
            renderFileExplorer();
            schedulePersist();
            showToast('Restored ' + lastDeletedItem.name, 'success');
            lastDeletedItem = null;
        });
    }

    // ============================================================
    // IMPORT
    // ============================================================
    function triggerImport() {
        showContextMenu(window.innerWidth / 2 - 100, window.innerHeight / 2, [
            { icon: 'fa-file', label: 'Import Files', action: function () { fileInput.click(); } },
            { icon: 'fa-folder-open', label: 'Import Folder', action: function () { folderInput.click(); } },
            { icon: 'fa-image', label: 'Import Image', action: function () { imageInput.click(); } }
        ]);
    }
    fileInput.addEventListener('change', function (e) { handleFileImport(e.target.files); });
    folderInput.addEventListener('change', function (e) { handleFolderImport(e.target.files); });
    imageInput.addEventListener('change', function (e) { handleFileImport(e.target.files); });
    function handleFileImport(files) {
        if (!files || files.length === 0) return;
        var promises = [];
        for (var i = 0; i < files.length; i++) promises.push(importFile(files[i], ''));
        Promise.all(promises).then(function () {
            renderFileExplorer();
            showToast('Imported ' + files.length + ' file(s)', 'success');
            fileInput.value = ''; imageInput.value = '';
            if (previewVisible) refreshPreview();
            schedulePersist();
        });
    }
    function handleFolderImport(files) {
        if (!files || files.length === 0) return;
        var promises = [];
        for (var i = 0; i < files.length; i++) promises.push(importFile(files[i], files[i].webkitRelativePath || files[i].name));
        Promise.all(promises).then(function () {
            renderFileExplorer();
            showToast('Imported ' + files.length + ' files', 'success');
            folderInput.value = '';
            if (previewVisible) refreshPreview();
            schedulePersist();
        });
    }
    function importFile(file, relativePath) {
        var pathParts = relativePath ? relativePath.split('/') : [file.name];
        var current = fileSystem;
        for (var i = 0; i < pathParts.length - 1; i++) {
            var folderName = pathParts[i];
            if (!current[folderName]) current[folderName] = { type: 'folder', children: {} };
            if (current[folderName].type !== 'folder') return Promise.resolve();
            current = current[folderName].children;
        }
        var fileName = pathParts[pathParts.length - 1];
        var isImage = (file.type && file.type.indexOf('image/') === 0) || /\.(png|jpg|jpeg|gif|svg|webp|bmp|ico)$/i.test(fileName);
        if (isImage) {
            return readFileAsDataURL(file).then(function (content) {
                current[fileName] = { type: 'image', language: 'image', content: content };
            });
        } else {
            return readFileAsText(file).then(function (content) {
                var language = 'javascript';
                if (fileName.endsWith('.html')) language = 'htmlmixed';
                else if (fileName.endsWith('.css')) language = 'css';
                else if (fileName.endsWith('.md')) language = 'markdown';
                current[fileName] = { type: 'file', language: language, content: content };
            }).catch(function () {
                current[fileName] = { type: 'file', language: 'javascript', content: '// Binary file not supported' };
            });
        }
    }
    function readFileAsText(file) {
        return new Promise(function (resolve, reject) {
            var reader = new FileReader();
            reader.onload = function () { resolve(reader.result); };
            reader.onerror = reject;
            reader.readAsText(file);
        });
    }
    function readFileAsDataURL(file) {
        return new Promise(function (resolve, reject) {
            var reader = new FileReader();
            reader.onload = function () { resolve(reader.result); };
            reader.onerror = reject;
            reader.readAsDataURL(file);
        });
    }
    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(function (eventName) {
        document.body.addEventListener(eventName, function (e) { e.preventDefault(); e.stopPropagation(); }, false);
    });
    fileExplorer.addEventListener('dragenter', function (e) { e.preventDefault(); fileExplorer.classList.add('drag-over'); });
    fileExplorer.addEventListener('dragover', function (e) { e.preventDefault(); fileExplorer.classList.add('drag-over'); });
    fileExplorer.addEventListener('dragleave', function (e) {
        if (e.target === fileExplorer || !fileExplorer.contains(e.relatedTarget)) fileExplorer.classList.remove('drag-over');
    });
    fileExplorer.addEventListener('drop', function (e) {
        e.preventDefault();
        fileExplorer.classList.remove('drag-over');
        var items = e.dataTransfer.items;
        if (!items) return;
        var files = [];
        function traverse(item, path) {
            path = path || '';
            return new Promise(function (resolve) {
                if (item.isFile) {
                    item.file(function (f) { f._relativePath = path + f.name; files.push(f); resolve(); });
                } else if (item.isDirectory) {
                    var reader = item.createReader();
                    reader.readEntries(function (entries) {
                        var chain = Promise.resolve();
                        entries.forEach(function (entry) { chain = chain.then(function () { return traverse(entry, path + item.name + '/'); }); });
                        chain.then(resolve);
                    });
                } else resolve();
            });
        }
        var arr = [];
        for (var i = 0; i < items.length; i++) {
            var entry = items[i].webkitGetAsEntry ? items[i].webkitGetAsEntry() : null;
            if (entry) arr.push(traverse(entry));
            else {
                var f = items[i].getAsFile();
                if (f) { f._relativePath = f.name; files.push(f); }
            }
        }
        Promise.all(arr).then(function () {
            var promises = files.map(function (f) { return importFile(f, f._relativePath || f.name); });
            Promise.all(promises).then(function () {
                renderFileExplorer();
                showToast('Imported ' + files.length + ' file(s)', 'success');
                if (previewVisible) refreshPreview();
                schedulePersist();
            });
        });
    });

    // ============================================================
    // CONTEXT MENU
    // ============================================================
    function showContextMenu(x, y, items) {
        hideContextMenu();
        var menu = document.createElement('div');
        menu.className = 'context-menu';
        items.forEach(function (item) {
            if (item.divider) {
                var div = document.createElement('div'); div.className = 'divider'; menu.appendChild(div);
            } else {
                var el = document.createElement('div');
                el.className = 'menu-item' + (item.danger ? ' danger' : '');
                el.innerHTML = '<i class="fas ' + item.icon + '"></i> ' + item.label;
                el.addEventListener('click', function () { hideContextMenu(); item.action(); });
                menu.appendChild(el);
            }
        });
        document.body.appendChild(menu);
        contextMenuElement = menu;
        var rect = menu.getBoundingClientRect();
        menu.style.left = Math.min(x, window.innerWidth - rect.width - 10) + 'px';
        menu.style.top = Math.min(y, window.innerHeight - rect.height - 10) + 'px';
        setTimeout(function () {
            document.addEventListener('click', hideContextMenu, { once: true });
            document.addEventListener('contextmenu', hideContextMenu, { once: true });
        }, 10);
    }
    function hideContextMenu() { if (contextMenuElement) { contextMenuElement.remove(); contextMenuElement = null; } }

    // ============================================================
    // TABS
    // ============================================================
    function renderTabs() {
        tabsContainer.innerHTML = '';
        openFiles.forEach(function (file) {
            var tab = document.createElement('div');
            tab.className = 'tab' + (file.path === activeFilePath ? ' active' : '');
            var iconInfo = getFileIcon(file.name, file);
            tab.innerHTML =
                '<i class="fas ' + iconInfo.class + '" style="color:' + iconInfo.color + ';"></i>' +
                '<span class="tab-name">' + escapeHtml(file.name) + (file.modified ? ' ●' : '') + '</span>' +
                '<span class="close"><i class="fas fa-times"></i></span>';
            tab.addEventListener('click', function () { switchToFile(file.path); });
            tab.querySelector('.close').addEventListener('click', function (e) { closeFile(file.path, e); });
            tab.addEventListener('contextmenu', function (e) {
                e.preventDefault();
                showContextMenu(e.clientX, e.clientY, [
                    { icon: 'fa-times', label: 'Close Tab', action: function () { closeFile(file.path); } },
                    { icon: 'fa-download', label: 'Download File', action: function () { var it = getFileByPath(file.path); if (it) downloadSingleFile(file.path, file.name, it); } },
                    { divider: true },
                    { icon: 'fa-i-cursor', label: 'Rename File', action: function () { renameItem(file.path, file.name); } },
                    { icon: 'fa-trash', label: 'Delete File', danger: true, action: function () { deleteItem(file.path, file.name, false); } }
                ]);
            });
            tabsContainer.appendChild(tab);
        });
    }

    // ============================================================
    // SIDEBAR
    // ============================================================
    function closeSidebar() {
        sidebar.classList.add('collapsed');
        document.querySelectorAll('.activity-bar .icon').forEach(function (i) { i.classList.remove('active'); });
    }
    function toggleSidebar() {
        sidebar.classList.toggle('collapsed');
        if (sidebar.classList.contains('collapsed')) {
            document.querySelectorAll('.activity-bar .icon').forEach(function (i) { i.classList.remove('active'); });
        }
    }

    // ============================================================
    // PREVIEW
    // ============================================================
    function togglePreview() {
        previewVisible = !previewVisible;
        if (previewVisible) {
            previewPane.classList.remove('hidden');
            resizeHandle.style.display = 'block';
            document.getElementById('runBtnText').textContent = 'Stop';
            refreshPreview();
        } else {
            previewPane.classList.add('hidden');
            resizeHandle.style.display = 'none';
            document.getElementById('runBtnText').textContent = 'Run';
        }
    }
    function resolveAsset(ref, type) {
        if (!ref) return null;
        ref = ref.replace(/^\.\//, '').split('?')[0].split('#')[0];
        var direct = getFileByPath(ref);
        if (direct && direct.type === 'file') return { content: direct.content, name: ref };
        var baseName = ref.split('/').pop();
        var found = searchFileSystem(fileSystem, function (fileName, item) { return item.type === 'file' && fileName === baseName; });
        if (found) return { content: found.content, name: found.name };
        if (type === 'css') return findFileByExt('.css');
        if (type === 'js') return findFileByExt('.js');
        return null;
    }
    function refreshPreview(manual) {
        if (!previewVisible && !manual) return;
        var htmlFile = findFileByName('index.html') || findFileByExt('.html');
        var htmlContent = htmlFile ? htmlFile.content : '';
        if (!htmlContent) {
            htmlContent = '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Preview</title></head><body style="font-family:system-ui;padding:40px;text-align:center;color:#666;"><h1>No HTML file found</h1><p>Create an <strong>index.html</strong> to see your preview.</p></body></html>';
        }
        var fullDoc = htmlContent;
        fullDoc = fullDoc.replace(/<link\b[^>]*>/gi, function (tag) {
            if (!/rel\s*=\s*["']?stylesheet/i.test(tag)) return tag;
            var hrefMatch = tag.match(/href\s*=\s*["']([^"']+)["']/i);
            if (!hrefMatch) return '';
            var css = resolveAsset(hrefMatch[1], 'css');
            if (css) return '<style data-source="' + hrefMatch[1] + '">\n' + css.content + '\n</style>';
            return '';
        });
        if (!fullDoc.match(/<style/i)) {
            var cssFile = findFileByName('styles.css') || findFileByName('style.css') || findFileByExt('.css');
            if (cssFile && cssFile.content) {
                if (fullDoc.indexOf('</head>') !== -1) fullDoc = fullDoc.replace('</head>', '<style>\n' + cssFile.content + '\n</style>\n</head>');
                else if (fullDoc.indexOf('<body') !== -1) fullDoc = fullDoc.replace('<body', '<style>\n' + cssFile.content + '\n</style>\n<body');
                else fullDoc = '<style>\n' + cssFile.content + '\n</style>\n' + fullDoc;
            }
        }
        fullDoc = fullDoc.replace(/<script\b[^>]*\bsrc\s*=\s*["']([^"']+)["'][^>]*>\s*<\/script>/gi, function (tag, src) {
            var js = resolveAsset(src, 'js');
            if (js) return '<script data-source="' + src + '">\n' + js.content + '\n<\/script>';
            return '';
        });
        if (!fullDoc.match(/<script\b[^>]*>[\s\S]*?<\/script>/i)) {
            var jsFile = findFileByName('app.js') || findFileByName('script.js') || findFileByName('main.js') || findFileByExt('.js');
            if (jsFile && jsFile.content) {
                if (fullDoc.indexOf('</body>') !== -1) fullDoc = fullDoc.replace('</body>', '<script>\n' + jsFile.content + '\n<\/script>\n</body>');
                else fullDoc += '\n<script>\n' + jsFile.content + '\n<\/script>';
            }
        }
        previewFrame.srcdoc = fullDoc;
        previewStatus.textContent = 'Updated ' + new Date().toLocaleTimeString();
        setTimeout(function () { previewStatus.textContent = 'Auto'; }, 2000);
    }
    function findFileByName(name) {
        for (var i = 0; i < openFiles.length; i++) {
            if (openFiles[i].name === name && openFiles[i].type !== 'image') {
                return { path: openFiles[i].path, content: openFiles[i].content, name: openFiles[i].name };
            }
        }
        return searchFileSystem(fileSystem, function (fileName, item) { return fileName === name && item.type === 'file'; });
    }
    function findFileByExt(ext) {
        for (var i = 0; i < openFiles.length; i++) {
            if (openFiles[i].name.endsWith(ext) && openFiles[i].type !== 'image') {
                return { path: openFiles[i].path, content: openFiles[i].content, name: openFiles[i].name };
            }
        }
        return searchFileSystem(fileSystem, function (fileName, item) { return fileName.endsWith(ext) && item.type === 'file'; });
    }
    function searchFileSystem(folder, predicate, path) {
        path = path || '';
        for (var name in folder) {
            if (!folder.hasOwnProperty(name)) continue;
            var item = folder[name];
            var fullPath = path ? (path + '/' + name) : name;
            if (item.type === 'file') {
                if (predicate(name, item)) return { path: fullPath, content: item.content, name: name };
            } else if (item.type === 'folder' && item.children) {
                var result = searchFileSystem(item.children, predicate, fullPath);
                if (result) return result;
            }
        }
        return null;
    }
    function openPreviewInNewTab() {
        var content = previewFrame.srcdoc;
        var w = window.open('', '_blank');
        w.document.open(); w.document.write(content); w.document.close();
    }

    // ============================================================
    // SIDEBAR VIEWS
    // ============================================================
    document.querySelectorAll('.activity-bar .icon').forEach(function (icon) {
        icon.addEventListener('click', function () {
            var view = this.getAttribute('data-view');
            var wasActive = this.classList.contains('active');
            var sidebarCollapsed = sidebar.classList.contains('collapsed');
            if (wasActive && !sidebarCollapsed) { closeSidebar(); return; }
            document.querySelectorAll('.activity-bar .icon').forEach(function (i) { i.classList.remove('active'); });
            this.classList.add('active');
            sidebar.classList.remove('collapsed');

            var titleEl = document.getElementById('sidebarTitle');
            var actionsEl = document.getElementById('sidebarActions');

            if (view === 'explorer') {
                titleEl.textContent = 'Explorer';
                actionsEl.innerHTML = '<i class="fas fa-file" title="New File" onclick="createNewFile()"></i>' +
                    '<i class="fas fa-folder-plus" title="New Folder" onclick="createNewFolder()"></i>' +
                    '<i class="fas fa-file-import" title="Import" onclick="triggerImport()"></i>' +
                    '<i class="fas fa-sync-alt" title="Refresh" onclick="refreshExplorer()"></i>' +
                    '<i class="fas fa-times close-sidebar" title="Close (Ctrl+B)" onclick="closeSidebar()"></i>';
                renderFileExplorer();
            } else if (view === 'search') {
                titleEl.textContent = 'Search';
                actionsEl.innerHTML = '<i class="fas fa-times close-sidebar" title="Close (Ctrl+B)" onclick="closeSidebar()"></i>';
                fileExplorer.innerHTML = '<div style="padding:10px 15px;"><input type="text" id="searchInput" placeholder="Search files..." style="width:100%;padding:6px 10px;background:#3c3c3c;border:1px solid #454545;border-radius:4px;color:#d4d4d4;font-size:12px;outline:none;" oninput="performSearch(this.value)"></div><div id="searchResults"></div>';
            } else if (view === 'save') {
                titleEl.textContent = 'Save & Export';
                actionsEl.innerHTML = '<i class="fas fa-times close-sidebar" title="Close (Ctrl+B)" onclick="closeSidebar()"></i>';
                renderSaveMenu();
            } else if (view === 'import') {
                titleEl.textContent = 'Import';
                actionsEl.innerHTML = '<i class="fas fa-times close-sidebar" title="Close (Ctrl+B)" onclick="closeSidebar()"></i>';
                fileExplorer.innerHTML = '<div style="padding:15px;">' +
                    '<div style="color:#858585;font-size:12px;margin-bottom:15px;">Import files, folders, or images into your project.</div>' +
                    '<button onclick="fileInput.click()" style="width:100%;padding:10px;margin-bottom:10px;background:#007acc;color:white;border:none;border-radius:4px;cursor:pointer;font-size:12px;"><i class="fas fa-file"></i> Import Files</button>' +
                    '<button onclick="folderInput.click()" style="width:100%;padding:10px;margin-bottom:10px;background:#007acc;color:white;border:none;border-radius:4px;cursor:pointer;font-size:12px;"><i class="fas fa-folder-open"></i> Import Folder</button>' +
                    '<button onclick="imageInput.click()" style="width:100%;padding:10px;margin-bottom:15px;background:#007acc;color:white;border:none;border-radius:4px;cursor:pointer;font-size:12px;"><i class="fas fa-image"></i> Import Image</button>' +
                    '<button onclick="jsonInput.click()" style="width:100%;padding:10px;margin-bottom:15px;background:#4ec9b0;color:#1e1e1e;border:none;border-radius:4px;cursor:pointer;font-size:12px;font-weight:600;"><i class="fas fa-file-code"></i> Load Workspace JSON</button>' +
                    '<div style="padding:15px;background:#2a2d2e;border-radius:4px;font-size:11px;color:#858585;text-align:center;"><i class="fas fa-info-circle"></i><br>You can also drag & drop files onto the Explorer</div></div>';
            } else if (view === 'snippets') {
                titleEl.textContent = 'Snippets & IntelliSense';
                actionsEl.innerHTML = '<i class="fas fa-times close-sidebar" title="Close (Ctrl+B)" onclick="closeSidebar()"></i>';
                renderSnippetsPanel();
            }
        });
    });

    function renderSnippetsPanel() {
        var lang = editor ? getActiveLang(editor) : 'javascript';
        var snips = SNIPPETS[lang] || [];
        var apis = LANGUAGE_APIS[lang] || [];
        var html = '';
        html += '<div style="padding:10px 15px;border-bottom:1px solid #333;"><div style="font-size:11px;color:#858585;">Language: <strong style="color:#d4d4d4;">' + (lang === 'htmlmixed' ? 'HTML' : lang.toUpperCase()) + '</strong></div></div>';
        html += '<div style="padding:10px 15px 6px;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#858585;font-weight:600;">Snippets (' + snips.length + ') — Tab/Enter to expand</div>';
        snips.forEach(function (s) {
            html += '<div style="padding:6px 15px;font-size:12px;display:flex;align-items:center;gap:10px;">' +
                '<span class="hint-prefix snippet">S</span>' +
                '<span style="color:#d4d4d4;font-family:monospace;flex:1;">' + escapeHtml(s.label) + '</span>' +
                '<span style="color:#858585;font-size:11px;">' + escapeHtml(s.detail || '') + '</span></div>';
        });
        html += '<div style="padding:14px 15px 6px;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#858585;font-weight:600;border-top:1px solid #333;margin-top:6px;">APIs (' + apis.length + ')</div>';
        apis.slice(0, 80).forEach(function (a) {
            var typeIcons = { keyword: 'K', function: 'ƒ', method: 'ƒ', property: 'P', class: 'C', variable: 'V', tag: 'T', attribute: 'A', 'css-prop': '{}' };
            var ic = typeIcons[a.type] || '·';
            html += '<div style="padding:6px 15px;font-size:12px;display:flex;align-items:center;gap:10px;">' +
                '<span class="hint-prefix ' + a.type + '">' + ic + '</span>' +
                '<span style="color:#d4d4d4;font-family:monospace;flex:1;">' + escapeHtml(a.label) + '</span>' +
                '<span style="color:#858585;font-size:11px;">' + escapeHtml(a.detail || '') + '</span></div>';
        });
        fileExplorer.innerHTML = html;
    }

    function performSearch(query) {
        var results = document.getElementById('searchResults');
        if (!query || query.length < 2) { results.innerHTML = ''; return; }
        var matches = [];
        function searchInFolder(folder, path) {
            for (var name in folder) {
                if (!folder.hasOwnProperty(name)) continue;
                var item = folder[name];
                var fullPath = path ? (path + '/' + name) : name;
                if (item.type === 'file' && item.content && item.content.indexOf('data:') !== 0 &&
                    item.content.toLowerCase().indexOf(query.toLowerCase()) !== -1) {
                    matches.push({ name: name, path: fullPath });
                } else if (item.type === 'folder' && item.children) searchInFolder(item.children, fullPath);
            }
        }
        searchInFolder(fileSystem, '');
        if (matches.length === 0) {
            results.innerHTML = '<div style="padding:15px;color:#858585;font-size:12px;">No results found</div>';
            return;
        }
        results.innerHTML = matches.map(function (m) {
            return '<div style="padding:8px 15px;cursor:pointer;font-size:12px;border-bottom:1px solid #2a2d2e;" onclick="openFileFromSearch(\'' + m.path.replace(/'/g, "\\'") + '\', \'' + m.name.replace(/'/g, "\\'") + '\')">' +
                '<div style="color:#d4d4d4;"><i class="fas fa-file" style="color:#519aba;"></i> ' + escapeHtml(m.name) + '</div>' +
                '<div style="color:#858585;font-size:11px;padding-left:20px;">' + escapeHtml(m.path) + '</div></div>';
        }).join('');
    }
    function openFileFromSearch(path, name) { var item = getFileByPath(path); if (item) openFileInEditor(path, name, item); }
    function refreshExplorer() { renderFileExplorer(); showToast('Explorer refreshed', 'info'); }

    // ============================================================
    // RESIZE
    // ============================================================
    resizeHandle.addEventListener('mousedown', function () {
        isResizing = true;
        document.body.style.cursor = 'col-resize';
        document.body.style.userSelect = 'none';
    });
    document.addEventListener('mousemove', function (e) {
        if (!isResizing) return;
        var container = document.getElementById('editorAndPreview');
        var rect = container.getBoundingClientRect();
        var percentage = ((e.clientX - rect.left) / rect.width) * 100;
        var clamped = Math.max(20, Math.min(80, percentage));
        document.getElementById('editorPane').style.flex = '0 0 ' + clamped + '%';
        previewPane.style.width = (100 - clamped) + '%';
    });
    document.addEventListener('mouseup', function () {
        if (isResizing) {
            isResizing = false;
            document.body.style.cursor = '';
            document.body.style.userSelect = '';
            if (editor) editor.refresh();
        }
    });

    // ============================================================
    // TOAST
    // ============================================================
    function showToast(message, type) {
        type = type || 'info';
        var container = document.getElementById('toastContainer');
        var toast = document.createElement('div');
        toast.className = 'toast ' + type;
        var icons = { success: 'fa-check-circle', error: 'fa-exclamation-circle', info: 'fa-info-circle' };
        toast.innerHTML = '<i class="fas ' + (icons[type] || icons.info) + '"></i> ' + escapeHtml(message);
        container.appendChild(toast);
        setTimeout(function () {
            toast.style.animation = 'slideOut 0.3s ease forwards';
            setTimeout(function () { toast.remove(); }, 300);
        }, 2500);
    }
    function showToastWithUndo(message, undoFn) {
        var container = document.getElementById('toastContainer');
        var toast = document.createElement('div');
        toast.className = 'toast info';
        toast.innerHTML = '<i class="fas fa-info-circle"></i> ' + escapeHtml(message) + '<button class="undo-btn"><i class="fas fa-undo"></i> Undo</button>';
        toast.querySelector('.undo-btn').addEventListener('click', function () { undoFn(); toast.remove(); });
        container.appendChild(toast);
        setTimeout(function () {
            toast.style.animation = 'slideOut 0.3s ease forwards';
            setTimeout(function () { toast.remove(); }, 300);
        }, 6000);
    }

    // ============================================================
    // MODALS
    // ============================================================
    function showInputModal(title, placeholder, defaultValue, onConfirm) {
        var overlay = document.createElement('div');
        overlay.className = 'modal-overlay';
        overlay.innerHTML = '<div class="modal"><h3>' + escapeHtml(title) + '</h3>' +
            '<input type="text" placeholder="' + escapeHtml(placeholder) + '" value="' + escapeHtml(defaultValue || '') + '">' +
            '<div class="buttons"><button class="secondary">Cancel</button><button class="primary">OK</button></div></div>';
        document.body.appendChild(overlay);
        var input = overlay.querySelector('input');
        input.focus(); input.select();
        function close() { overlay.remove(); }
        function confirm() { var val = input.value.trim(); close(); if (val) onConfirm(val); }
        overlay.querySelector('.primary').addEventListener('click', confirm);
        overlay.querySelector('.secondary').addEventListener('click', close);
        input.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') confirm();
            if (e.key === 'Escape') close();
        });
        overlay.addEventListener('click', function (e) { if (e.target === overlay) close(); });
    }
    function showConfirmModal(title, message, confirmLabel, onConfirm) {
        var overlay = document.createElement('div');
        overlay.className = 'modal-overlay';
        overlay.innerHTML = '<div class="modal"><h3>' + escapeHtml(title) + '</h3>' +
            '<p>' + escapeHtml(message) + '</p>' +
            '<div class="buttons"><button class="secondary">Cancel</button><button class="danger">' + escapeHtml(confirmLabel) + '</button></div></div>';
        document.body.appendChild(overlay);
        function close() { overlay.remove(); }
        overlay.querySelector('.danger').addEventListener('click', function () { close(); onConfirm(); });
        overlay.querySelector('.secondary').addEventListener('click', close);
        overlay.addEventListener('click', function (e) { if (e.target === overlay) close(); });
        var escHandler = function (e) {
            if (e.key === 'Escape') { close(); document.removeEventListener('keydown', escHandler); }
            if (e.key === 'Enter') { close(); onConfirm(); document.removeEventListener('keydown', escHandler); }
        };
        document.addEventListener('keydown', escHandler);
    }

    // ============================================================
    // KEYBOARD
    // ============================================================
    document.addEventListener('keydown', function (e) {
        var editorFocused = editor && editor.hasFocus && editor.hasFocus();
        if (e.key === 'Delete' && selectedExplorerItem && !editorFocused) {
            e.preventDefault();
            deleteItem(selectedExplorerItem.path, selectedExplorerItem.name, selectedExplorerItem.isFolder);
            return;
        }
        if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key === 'S') {
            e.preventDefault();
            openSaveMenu();
            return;
        }
        if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); forceSave(); }
        if ((e.ctrlKey || e.metaKey) && e.key === 'b') { e.preventDefault(); toggleSidebar(); }
        if (e.key === 'F5' && !e.ctrlKey && !e.metaKey) { e.preventDefault(); togglePreview(); }
    });

    // Save on page unload
    window.addEventListener('beforeunload', function () {
        // Force-sync any pending changes to fileSystem, then save
        if (activeFilePath) {
            var f = findOpenFile(activeFilePath);
            if (f && f.type !== 'image') {
                var fsFile = getFileByPath(activeFilePath);
                if (fsFile) fsFile.content = editor.getValue();
            }
        }
        try { saveToBrowser(true); } catch (e) {}
    });

    // ============================================================
    // INIT
    // ============================================================
    function init() {
        try {
            // Try loading persisted workspace first
            var restored = loadFromBrowser();

            initEditor();

            if (restored) {
                renderFileExplorer();
                renderTabs();
                if (activeFilePath && getFileByPath(activeFilePath)) {
                    var f = getFileByPath(activeFilePath);
                    openFileInEditor(activeFilePath, activeFilePath.split('/').pop(), f);
                } else if (openFiles.length > 0) {
                    switchToFile(openFiles[0].path);
                } else {
                    var first = findFileByExt('.html');
                    if (first) openFileInEditor(first.path, first.name, getFileByPath(first.path));
                }
                updatePersistIndicator();
                showToast('Restored workspace from browser', 'success');
            } else {
                renderFileExplorer();
                openFileInEditor('app.js', 'app.js', fileSystem['app.js']);
                showToast('Welcome! Click SAVE to download or persist work', 'info');
            }

            previewVisible = true;
            previewPane.classList.remove('hidden');
            resizeHandle.style.display = 'block';
            document.getElementById('runBtnText').textContent = 'Stop';

            updateTitleBar();
            updateDirtyCount();
            setTimeout(function () { refreshPreview(); }, 300);
        } catch (err) {
            console.error('Init error:', err);
            showToast('Error: ' + err.message, 'error');
        }
    }

    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
    else init();
    </script>
